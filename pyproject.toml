[project]
name = "spark-flight-delay-pipeline"
version = "1.0.0"
description = "Reproducible Spark-Flight-Delay-Pipeline portfolio project by Licheng Xiong"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "pyspark==3.5.9",
  "pandas>=2.2,<3",
  "scikit-learn>=1.3",
  "numpy>=1.26,<2",
  "jupyterlab>=4.0",
  "matplotlib>=3.7"
]

[dependency-groups]
dev = ["pytest>=8,<10", "nbformat>=5,<6", "nbconvert>=7,<8", "ipykernel>=6,<8"]

[tool.uv]
package = false

# Upstream metadata: https://pypi.org/pypi/pyspark/3.5.9/json
[[tool.uv.dependency-metadata]]
name = "pyspark"
version = "3.5.9"
requires-python = ">=3.8"
requires-dist = [
  "py4j<0.10.9.10,>=0.10.9.7",
  "numpy<2,>=1.15; extra == \"ml\"",
  "numpy<2,>=1.15; extra == \"mllib\"",
  "pandas>=1.0.5; extra == \"sql\"",
  "pyarrow>=4.0.0; extra == \"sql\"",
  "numpy<2,>=1.15; extra == \"sql\"",
  "pandas>=1.0.5; extra == \"pandas-on-spark\"",
  "pyarrow>=4.0.0; extra == \"pandas-on-spark\"",
  "numpy<2,>=1.15; extra == \"pandas-on-spark\"",
  "pandas>=1.0.5; extra == \"connect\"",
  "pyarrow>=4.0.0; extra == \"connect\"",
  "grpcio>=1.56.0; extra == \"connect\"",
  "grpcio-status>=1.56.0; extra == \"connect\"",
  "googleapis-common-protos>=1.56.4; extra == \"connect\"",
  "numpy<2,>=1.15; extra == \"connect\""
]
